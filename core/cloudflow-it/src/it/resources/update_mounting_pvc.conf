cloudflow.runtimes.pekko.kubernetes.pods.pod {
  volumes {
    bar {
      pvc {
        name = myclaim
        read-only = false
      } 
    }
  }
  containers.container {
    volume-mounts {
      bar {
        mount-path: "/tmp/some-pekko"
        read-only =  false
      }
    }
  }
}
