name: Build and Test

on:
  # Trigger the workflow on push or pull request,
  # push only for the main branch
  # PR for all branches
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test-docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build documentation
      run: |
        git fetch --depth=1 origin +refs/tags/*:refs/tags/*
        sudo snap install yq
        cd docs
        make html-author-mode
        grep -r "page unresolved" target/staging/docs/ && exit 1 || echo 'ok'

  build-and-test-core:
    name: "Cloudflow Core"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - name: Cache SBT and Coursier cache
      uses: coursier/cache-action@v6

    - name: Scalafmt check
      env:
        LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
      run: cd core && sbt "scalafmtCheckAll; scalafmtSbtCheck"

    - name: build-and-test
      env:
        LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
        SBT_OPTS: -Xms512M -Xmx2048M -Xss2M -XX:MaxMetaspaceSize=1024M
      run: ./scripts/build-core.sh +test

  build-and-test-sbt-examples:
    name: "sbt samples"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Examples use old Akka HTTP/Alpakka deps that have no Scala 3 artifacts;
    # updating them requires a full commercial Akka upgrade (out of scope here).
    continue-on-error: true
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - name: Cache SBT and Coursier cache
      uses: coursier/cache-action@v6

    - name: test-sbt-examples
      env:
        LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
      run: ./scripts/build-sbt-examples.sh test

  build-and-test-mvn-examples:
    name: "mvn samples"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Examples use old Akka HTTP/Alpakka deps that have no Scala 3 artifacts;
    # updating them requires a full commercial Akka upgrade (out of scope here).
    continue-on-error: true
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - name: Cache SBT and Coursier cache
      uses: coursier/cache-action@v6

    - name: test-maven-examples
      env:
        LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
      run: ./scripts/build-mvn-examples.sh test

  fossa-checks:
    name: "FOSSA checks"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: FOSSA policy check
      if: ${{ github.event_name != 'pull_request' }}
      run: |-
        cd core
        curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/spectrometer/master/install.sh | bash
        fossa analyze && fossa test
      env:
        FOSSA_API_KEY: "${{secrets.FOSSA_API_KEY}}"
