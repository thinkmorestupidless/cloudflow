name: Release

# A release is a pushed tag: `git tag -a v0.2.0 -m ... && git push origin v0.2.0`.
# sbt-dynver derives the version from that tag, so every artefact and the operator image
# carry exactly the tag's version. Untagged commits never publish, which is what keeps a
# build from colliding with (or, on GHCR, where tags are mutable, overwriting) a release.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver needs the history and tags
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Cache SBT
        uses: coursier/cache-action@v6
      - name: Refuse a version that is not exactly the tag
        working-directory: core
        env:
          LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
        run: |
          VERSION=$(sbt -Dsbt.supershell=false --error 'print cloudflow-streamlets/version' | tail -1)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "sbt-dynver computed version '${VERSION}' for tag '${GITHUB_REF_NAME}' — the tag is not on this commit, or the tree is dirty." >&2
            exit 1
          fi
      - name: Publish artefacts
        working-directory: core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
        run: sbt "cloudflow-blueprint_3/publish; publish"

  publish-operator-image:
    runs-on: ubuntu-22.04
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Cache SBT
        uses: coursier/cache-action@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push cloudflow-operator image
        working-directory: core
        env:
          LIGHTBEND_COMMERCIAL_TOKEN: ${{ secrets.LIGHTBEND_COMMERCIAL_TOKEN }}
        run: |
          sbt \
            -Ddocker.registry=ghcr.io \
            -Ddocker.username=thinkmorestupidless \
            cloudflow-operator/docker:publish
